<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Edit Designation</h2>
      <p>Update designation information.</p>
    </div>

    <div class="page-actions">
      <a routerLink="/designations" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i>
        Back to Designations
      </a>
    </div>

  </div>

  @if (designation.designationID !== 0) {

  <div class="form-card">

    <div class="form-grid">

      <div class="form-group">

        <label for="designationName">
          Designation Name
        </label>

        <input id="designationName" type="text" class="form-control" [(ngModel)]="designation.designationName"
          placeholder="Enter designation name">

      </div>

      <!-- <div class="form-group">

        <label for="departmentName">
          Department Name
        </label>

        <select id="department" class="form-select" [(ngModel)]="designation.departmentID" name="departmentID">

          <option *ngFor="let department of departments" [value]="department.departmentID">

            {{ department.departmentName }}

          </option>

        </select>
      </div> -->

      <div class="form-group">

        <label for="isActive">
          Status
        </label>

        <select id="isActive" class="form-select" [(ngModel)]="designation.isActive">

          <option [ngValue]="true">
            Active
          </option>

          <option [ngValue]="false">
            Inactive
          </option>

        </select>

      </div>

    </div>

    <div class="form-actions">

      <a routerLink="/designations" class="btn btn-secondary">
        Cancel
      </a>

      <button type="button" class="btn btn-primary" (click)="updateDesignation()">
        <i class="bi bi-save"></i>
        Update Designation
      </button>

    </div>

  </div>

  } @else {

  <div class="form-card text-center">
    <p class="text-muted mb-0">
      Loading designation details...
    </p>
  </div>

  }

</div>
