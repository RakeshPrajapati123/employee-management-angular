<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Add Role</h2>
      <p>Create a new role.</p>
    </div>

    <div class="page-actions">
      <a routerLink="/roles" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i>
        Back to Roles
      </a>
    </div>

  </div>

  <div class="form-card">

    <form #roleForm="ngForm" (ngSubmit)="addRole()" novalidate>

      <div class="form-grid">

        <div class="form-group">

          <label for="roleName">Role Name</label>

          <input
            id="roleName"
            name="roleName"
            type="text"
            class="form-control"
            [(ngModel)]="role.roleName"
            placeholder="Enter role name">

        </div>

        <div class="form-group">

          <label for="roleDescription">Role Description</label>

          <input
            id="roleDescription"
            name="roleDescription"
            type="text"
            class="form-control"
            [(ngModel)]="role.roleDescription"
            placeholder="Enter role description">

        </div>

        <div class="form-group">

          <label for="isActive">Status</label>

          <select
            id="isActive"
            name="isActive"
            class="form-select"
            [(ngModel)]="role.isActive">

            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>

          </select>

        </div>

      </div>

      <div class="form-actions">

        <a routerLink="/roles" class="btn btn-secondary">Cancel</a>

        <button type="submit" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i>
          Add Role
        </button>

      </div>

    </form>

  </div>

</div>
