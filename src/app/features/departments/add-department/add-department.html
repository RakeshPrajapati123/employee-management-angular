<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Add Department</h2>
      <p>Create a new department.</p>
    </div>

    <div class="page-actions">
      <a routerLink="/departments" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i>
        Back to Departments
      </a>
    </div>

  </div>

  <div class="form-card">

    <form #departmentForm="ngForm" (ngSubmit)="addDepartment()" novalidate>

      <div class="form-grid">

        <div class="form-group">

          <label for="departmentName">Department Name</label>

          <input
            id="departmentName"
            name="departmentName"
            type="text"
            class="form-control"
            [(ngModel)]="department.departmentName"
            placeholder="Enter department name">

        </div>

        <div class="form-group">

          <label for="isActive">Status</label>

          <select
            id="isActive"
            name="isActive"
            class="form-select"
            [(ngModel)]="department.isActive">

            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>

          </select>

        </div>

      </div>

      <div class="form-actions">

        <a routerLink="/departments" class="btn btn-secondary">Cancel</a>

        <button type="submit" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i>
          Add Department
        </button>

      </div>

    </form>

  </div>

</div>
